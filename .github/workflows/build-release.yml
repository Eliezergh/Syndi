name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest version tag
        id: latest
        run: |
          # Fetch all tags and find the latest semver tag
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          VERSION="${LATEST_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG (version: $VERSION)"

      - name: Bump version
        id: bump
        run: |
          CURRENT="${{ steps.latest.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "${{ github.event.inputs.bump }}" in
            major)
              NEW_MAJOR=$((MAJOR+1))
              NEW_VERSION="$NEW_MAJOR.0.0"
              ;;
            minor)
              NEW_MINOR=$((MINOR+1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            patch)
              NEW_PATCH=$((PATCH+1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
          esac
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumping from $CURRENT to $NEW_VERSION"

      - name: Update version in source files
        run: |
          sed -i 's/APP_VERSION = "[^"]*"/APP_VERSION = "${{ steps.bump.outputs.version }}"/' src/core.py
          sed -i 's/APP_VERSION = "[^"]*"/APP_VERSION = "${{ steps.bump.outputs.version }}"/' src/syndi.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/core.py src/syndi.py
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"

      - name: Create and push tags
        run: |
          NEW_VERSION="${{ steps.bump.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NEW_VERSION"
          
          # Create full version tag
          git tag -a "v$NEW_VERSION" -m "Release v$NEW_VERSION"
          
          # Create/update major version tag (e.g., v1)
          git tag -fa "v$MAJOR" -m "Latest v$MAJOR release"
          
          git push origin main --follow-tags
          echo "Created tags: v$NEW_VERSION and v$MAJOR"

  test:
    # Runs on both tag push and workflow_dispatch (via tag push from version-bump)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Check Ruff formatting
        run: ruff format --check src tests

      - name: Run tests (release gate)
        run: pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-release-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp version into source
        run: |
          python3 -c "
          import re, pathlib
          ver = '${{ steps.version.outputs.version }}'
          for f in ['src/syndi.py', 'src/core.py']:
              p = pathlib.Path(f)
              p.write_text(re.sub(r'APP_VERSION = \".*?\"', f'APP_VERSION = \"{ver}\"', p.read_text()))
          "

      - name: Build app with py2app
        run: |
          cd setup
          python setup.py py2app

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - setup/dist/Syndi.app

      - name: Create ZIP archive
        run: |
          cd setup/dist
          zip -r "Syndi-${{ github.ref_name }}-macos.zip" Syndi.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Syndi-${{ github.ref_name }}-macos
          path: setup/dist/Syndi-${{ github.ref_name }}-macos.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Syndi-${{ github.ref_name }}-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Syndi ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: Syndi-${{ github.ref_name }}-macos.zip
          body: |
            ## Syndi ${{ github.ref_name }}

            ### Installation
            1. Download `Syndi-${{ github.ref_name }}-macos.zip`
            2. Unzip and drag **Syndi.app** to your Applications folder
            3. Right-click → **Open** on first launch to bypass Gatekeeper (ad-hoc signed)
            4. On first run, Syndi copies the default `config.json` to `~/.syndi/config.json`
            5. Edit that file to add your RSS feeds, then use **Options → Reload config**
